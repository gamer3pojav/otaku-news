<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://graphql.anilist.co" crossorigin>
<link rel="preconnect" href="https://s4.anilist.co" crossorigin>
<link rel="dns-prefetch" href="https://i.ytimg.com">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loading… — Otaku News</title>
<link rel="stylesheet" href="style.css">
<style>
  /* ---------- Anime detail page ---------- */
  .detail-wrap { max-width: 1080px; margin: 0 auto; padding: 28px 24px 70px; }
  .back-link {
    display: inline-flex; align-items: center; gap: 8px;
    font-size: 14px; font-weight: 600; color: var(--ink-soft);
    margin-bottom: 20px; transition: color .15s;
  }
  .back-link:hover { color: var(--accent); }

  .detail-banner {
    width: 100%; height: 150px; border-radius: 14px;
    border: 1.5px solid var(--line);
    object-fit: cover; display: none;
  }
  .detail-grid {
    display: grid; grid-template-columns: 210px 1fr; gap: 28px;
    margin-top: 22px;
  }
  .detail-poster {
    width: 100%; border-radius: 12px; border: 1.5px solid var(--line);
    box-shadow: 0 10px 26px rgba(0,0,0,.10);
  }
  .detail-side { display: flex; flex-direction: column; gap: 12px; }
  .detail-actions a {
    display: block; text-align: center; padding: 10px;
    border-radius: 10px; font-weight: 700; font-size: 13px;
    background: linear-gradient(100deg, var(--accent), #e0455a); color: #fff;
    transition: filter .15s, transform .18s cubic-bezier(.22,1,.36,1);
  }
  .detail-actions a:hover { filter: brightness(1.08); transform: translateY(-1px); }

  .stat-panel {
    border: 1.5px solid var(--line); border-radius: 12px;
    background: var(--card); padding: 13px; display: flex; flex-direction: column; gap: 8px;
  }
  .stat-row { display: flex; justify-content: space-between; font-size: 12.5px; gap: 10px; }
  .stat-row .k { color: var(--ink-faint); font-family: var(--mono); font-size: 10.5px; text-transform: uppercase; letter-spacing: .6px; }
  .stat-row .v { font-weight: 700; text-align: right; }

  .detail-title { font-size: clamp(22px, 3vw, 32px); letter-spacing: -0.7px; line-height: 1.15; font-weight: 800; }
  .detail-native { font-family: var(--mono); font-size: 12px; color: var(--ink-faint); margin-top: 5px; }
  .detail-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 13px; }
  .detail-desc { margin-top: 18px; font-size: 14.5px; line-height: 1.7; color: var(--ink-soft); max-width: 640px; }
  .detail-desc p + p { margin-top: 10px; }

  .next-ep {
    margin-top: 18px; display: inline-flex; align-items: center; gap: 9px;
    border: 1.5px solid var(--accent); background: var(--accent-soft);
    border-radius: 100px; padding: 7px 15px;
    font-family: var(--mono); font-size: 11.5px; font-weight: 700; color: var(--accent);
  }
  .next-ep .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); animation: pulse 1.6s infinite; }

  .detail-section-label {
    font-family: var(--mono); font-size: 11px; letter-spacing: 2px;
    text-transform: uppercase; color: var(--ink-faint);
    margin: 24px 0 10px;
  }
  .char-row { display: grid; grid-template-columns: repeat(auto-fill, minmax(78px, 1fr)); gap: 12px; max-width: 640px; }
  .char { text-align: center; }
  .char img {
    width: 58px; height: 58px; border-radius: 50%; object-fit: cover;
    border: 1.5px solid var(--line); margin: 0 auto 6px;
  }
  .char .cname { font-size: 11.5px; font-weight: 600; line-height: 1.3; }

  .trailer-btn {
    display: inline-flex; align-items: center; gap: 8px;
    border: 1.5px solid var(--line); border-radius: 10px;
    background: var(--card); color: var(--ink);
    padding: 10px 16px; font-weight: 700; font-size: 13px;
    transition: border-color .15s, color .15s;
  }
  .trailer-btn:hover { border-color: var(--accent); color: var(--accent); }
  .trailer-embed {
    max-width: 640px; border-radius: 12px; overflow: hidden;
    border: 1.5px solid var(--line); aspect-ratio: 16/9; background: #000;
    position: relative; cursor: pointer;
  }
  .trailer-embed iframe, .trailer-embed img { width: 100%; height: 100%; display: block; object-fit: cover; }
  .trailer-embed .play-btn {
    position: absolute; inset: 0; display: grid; place-items: center;
    font-size: 22px; color: #fff;
    background: rgba(0,0,0,.25); transition: background .2s;
  }
  .trailer-embed .play-btn::before {
    content: ""; position: absolute; width: 64px; height: 64px; border-radius: 50%;
    background: var(--accent); z-index: -1;
    box-shadow: 0 8px 24px rgba(224,69,90,.5);
    transition: transform .2s cubic-bezier(.22,1,.36,1);
  }
  .trailer-embed:hover .play-btn { background: rgba(0,0,0,.1); }
  .trailer-embed:hover .play-btn::before { transform: scale(1.1); }

  .detail-error { text-align: center; padding: 80px 20px; color: var(--ink-faint); font-family: var(--mono); }
  .detail-skel { height: 420px; }

  /* Tablet */
  @media (max-width: 1000px) {
    .detail-grid { grid-template-columns: 180px 1fr; gap: 22px; }
  }

  /* Mobile: poster and stats sit side by side, compact */
  @media (max-width: 760px) {
    .detail-wrap { padding: 20px 16px 56px; }
    .detail-banner { height: 100px; }
    .detail-grid { grid-template-columns: 1fr; gap: 18px; margin-top: 16px; }
    .detail-side { flex-direction: row; flex-wrap: wrap; align-items: flex-start; }
    .detail-poster { width: 118px; flex-shrink: 0; }
    .stat-panel { flex: 1; min-width: 170px; }
    .detail-actions { width: 100%; }
    .detail-actions a { padding: 9px; font-size: 12.5px; }
    .detail-title { font-size: 21px; }
    .detail-desc { font-size: 14px; }
    .char-row { grid-template-columns: repeat(auto-fill, minmax(66px, 1fr)); }
    .char img { width: 48px; height: 48px; }
  }
</style>
</head>
<body>

<nav>
  <div class="nav-inner">
    <a href="index.html" class="logo">
      <span class="mark"><img src="assets/logo.jpg" alt="Kenjaku from Jujutsu Kaisen — Otaku News logo"></span>
      <span class="word">Otaku News<span class="jp">オタクニュース</span></span>
    </a>
    <div class="nav-actions">
      <button id="theme-toggle" title="Toggle light / dark mode" aria-label="Toggle light / dark mode"><span class="ti-moon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></span><span class="ti-sun"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><line x1="12" y1="2" x2="12" y2="5"/><line x1="12" y1="19" x2="12" y2="22"/><line x1="4.9" y1="4.9" x2="7" y2="7"/><line x1="17" y1="17" x2="19.1" y2="19.1"/><line x1="2" y1="12" x2="5" y2="12"/><line x1="19" y1="12" x2="22" y2="12"/><line x1="4.9" y1="19.1" x2="7" y2="17"/><line x1="17" y1="7" x2="19.1" y2="4.9"/></svg></span></button>
    </div>
  </div>
</nav>

<div class="detail-wrap">
  <a class="back-link" href="index.html#airing">← Back to Otaku News</a>

  <div id="detail-content">
    <div class="skeleton detail-skel"></div>
  </div>
</div>

<footer>
  OTAKU NEWS © 2026 — MADE WITH <span class="heart">♥</span> BY FANS, FOR FANS · RANCHI → TOKYO
</footer>

<script>
  // ---------- Theme (shared with main page via same localStorage key) ----------
  const themeBtn = document.getElementById('theme-toggle');
  const root = document.documentElement;
  function applyTheme(t) {
    root.setAttribute('data-theme', t);
    try { localStorage.setItem('otaku-theme', t); } catch (e) {}
  }
  let saved = null;
  try { saved = localStorage.getItem('otaku-theme'); } catch (e) {}
  applyTheme(saved || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
  themeBtn.addEventListener('click', () =>
    applyTheme(root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark'));

  // ---------- Fetch & render anime details ----------
  const box = document.getElementById('detail-content');
  const id = parseInt(new URLSearchParams(location.search).get('id'), 10);

  const QUERY = `
    query ($id: Int) {
      Media(id: $id) {
        title { english romaji native }
        description(asHtml: false)
        averageScore meanScore popularity favourites
        stats { scoreDistribution { score amount } }
        genres format status episodes duration season seasonYear
        source studios(isMain: true) { nodes { name } }
        staff(perPage: 8, sort: RELEVANCE) { edges { role node { name { full } } } }
        startDate { year month day }
        bannerImage siteUrl
        coverImage { extraLarge large }
        trailer { id site }
        externalLinks { site type url color }
        relations { edges { relationType node { id type format title { english romaji } coverImage { large } seasonYear status } } }
        nextAiringEpisode { episode timeUntilAiring }
        characters(sort: ROLE, perPage: 6) {
          nodes { name { full } image { medium } }
        }
      }
    }`;

  function esc(s) {
    return (s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;');
  }

  function fail(msg) {
    box.innerHTML = `<div class="detail-error">⚠️ ${msg}<br><br><a class="back-link" href="index.html">← Back to the site</a></div>`;
  }

  if (!id) {
    fail('No anime specified.');
  } else {
    fetch('https://graphql.anilist.co', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
      body: JSON.stringify({ query: QUERY, variables: { id } })
    })
    .then(r => { if (!r.ok) throw 0; return r.json(); })
    .then(({ data }) => {
      const m = data.Media;
      const title = m.title.english || m.title.romaji;
      document.title = title + ' — Otaku News';

      const paras = (m.description || 'No synopsis available.')
        .replace(/<br\s*\/?>/gi, '\n').replace(/<[^>]*>/g, '')
        .split(/\n{2,}|\n/).filter(Boolean)
        .map(p => `<p>${esc(p)}</p>`).join('');

      const next = m.nextAiringEpisode;
      let nextHtml = '';
      if (next) {
        const s = next.timeUntilAiring;
        const d = Math.floor(s / 86400), h = Math.floor((s % 86400) / 3600), mn = Math.floor((s % 3600) / 60);
        nextHtml = `<div class="next-ep"><span class="dot"></span>EP ${next.episode} AIRS IN ${d > 0 ? d + 'D ' : ''}${h}H ${mn}M</div>`;
      }

      const date = m.startDate && m.startDate.year
        ? [m.startDate.year, m.startDate.month, m.startDate.day].filter(Boolean).join('-') : '—';
      const OTT_RANK = { 'Crunchyroll': 1, 'Netflix': 2, 'Prime Video': 3, 'Amazon Prime Video': 3, 'Hulu': 4, 'Disney Plus': 5, 'Max': 6, 'HIDIVE': 7 };
      const seenSites = new Set();
      const CREATOR_ROLES = ['Original Creator', 'Original Story', 'Story & Art', 'Story', 'Original Character Design'];
      let creator = null;
      for (const role of CREATOR_ROLES) {
        const hit = (m.staff.edges || []).find(e => (e.role || '').trim() === role);
        if (hit) { creator = hit.node.name.full; break; }
      }
      const streams = (m.externalLinks || []).filter(l => {
        if (l.type !== 'STREAMING' || seenSites.has(l.site)) return false;
        seenSites.add(l.site);
        return true;
      }).sort((x, y) => (OTT_RANK[x.site] || 99) - (OTT_RANK[y.site] || 99)).slice(0, 6);
      const watch = streams.length ? `<div class="detail-section-label">視聴 — Where to Watch</div>
        <div class="watch-row">${streams.map(l =>
          `<a class="watch-btn" href="${l.url}" target="_blank" rel="noopener" style="--brand:${l.color || 'var(--accent)'}">${l.site} ↗</a>`).join('')}</div>` : '';
      const trailer = m.trailer && m.trailer.site === 'youtube'
        ? `<a class="trailer-thumb" href="https://www.youtube.com/watch?v=${m.trailer.id}" target="_blank" rel="noopener">
             <img src="https://i.ytimg.com/vi/${m.trailer.id}/hqdefault.jpg" alt="Watch trailer on YouTube" loading="lazy">
             <span class="tt-overlay"><span class="tt-play">▶</span><span class="tt-label">Watch trailer on YouTube ↗</span></span>
           </a>`
        : `<a class="trailer-thumb" href="https://www.youtube.com/results?search_query=${encodeURIComponent(title + ' official trailer')}" target="_blank" rel="noopener">
             <img src="${m.coverImage.extraLarge || m.coverImage.large}" alt="Find trailer on YouTube" loading="lazy" style="object-position:top">
             <span class="tt-overlay"><span class="tt-play">▶</span><span class="tt-label">Find trailer on YouTube ↗</span></span>
           </a>`;

      const REL_LABEL = { PREQUEL: 'Prequel', SEQUEL: 'Sequel', SIDE_STORY: 'Side Story', SPIN_OFF: 'Spin-off', ALTERNATIVE: 'Alternative', PARENT: 'Parent Story', SUMMARY: 'Summary', SOURCE: 'Source' };
      const related = (m.relations.edges || [])
        .filter(e => e.node.type === 'ANIME' && REL_LABEL[e.relationType])
        .slice(0, 8);
      const relatedHtml = related.length ? `
        <div class="detail-section-label">シリーズ — Seasons &amp; Related</div>
        <div class="rel-row" id="rel-row">${related.map(e => `
          <a class="rel-card" href="anime.html?id=${e.node.id}">
            <img src="${e.node.coverImage.large}" alt="${(e.node.title.english || e.node.title.romaji).replace(/"/g, '&quot;')}" loading="lazy">
            <span class="rel-tag${e.node.status === 'NOT_YET_RELEASED' ? ' upcoming' : ''}">${e.node.status === 'NOT_YET_RELEASED' ? 'UPCOMING' : REL_LABEL[e.relationType]}</span>
            <span class="rel-name">${(e.node.title.english || e.node.title.romaji)}</span>
            <span class="rel-meta">${[e.node.format, e.node.seasonYear].filter(Boolean).join(' · ')}</span>
          </a>`).join('')}</div>` : '';
      const chars = (m.characters.nodes || []).map(c => `
        <div class="char">
          <img src="${c.image.medium}" alt="${esc(c.name.full)}" loading="lazy">
          <div class="cname">${esc(c.name.full)}</div>
        </div>`).join('');

      box.innerHTML = `
        ${m.bannerImage ? `<img class="detail-banner" src="${m.bannerImage}" alt="" style="display:block">` : ''}
        <div class="detail-grid">
          <div class="detail-side">
            <img class="detail-poster" src="${m.coverImage.extraLarge || m.coverImage.large}" alt="${esc(title)} poster">
            <div class="stat-panel">
              <div class="stat-row"><span class="k">Score</span><span class="v">${(() => { const d = m.stats && m.stats.scoreDistribution; if (d && d.length) { const t = d.reduce((s,x)=>s+x.amount,0); if (t) return (d.reduce((s,x)=>s+x.score*x.amount,0)/t/10).toFixed(2) + ' / 10'; } return m.averageScore ? (m.averageScore/10).toFixed(1) + ' / 10' : '—'; })()}</span></div>
              <div class="stat-row"><span class="k">Fans</span><span class="v">${m.popularity ? m.popularity.toLocaleString() : '—'}</span></div>
              <div class="stat-row"><span class="k">Favorites</span><span class="v">${m.favourites ? m.favourites.toLocaleString() : '—'}</span></div>
              <div class="stat-row"><span class="k">Format</span><span class="v">${(m.format || '—').replace(/_/g, ' ')}</span></div>
              <div class="stat-row"><span class="k">Episodes</span><span class="v">${m.episodes || (next ? next.episode - 1 + '+' : 'Ongoing')}</span></div>
              <div class="stat-row"><span class="k">Runtime</span><span class="v">${m.duration ? m.duration + ' min' : '—'}</span></div>
              <div class="stat-row"><span class="k">Season</span><span class="v">${m.season ? m.season + ' ' + m.seasonYear : '—'}</span></div>
              <div class="stat-row"><span class="k">Premiered</span><span class="v">${date}</span></div>
              <div class="stat-row"><span class="k">Source</span><span class="v">${(m.source || '—').replace(/_/g, ' ')}</span></div>
              <div class="stat-row"><span class="k">Studio</span><span class="v">${esc((m.studios.nodes[0] || {}).name || '—')}</span></div>
            </div>
            <div class="detail-actions"><a href="${m.siteUrl}" target="_blank" rel="noopener">View on AniList ↗</a></div>
          </div>
          <div>
            <h1 class="detail-title">${esc(title)}</h1>
            ${m.title.native ? `<div class="detail-native">${esc(m.title.native)}${m.title.romaji && m.title.romaji !== title ? ' · ' + esc(m.title.romaji) : ''}</div>` : ''}
            ${creator ? `<div class="review-author" style="margin-top:10px;border-top:none;padding-top:0"><span class="author-tag">AUTHOR</span>${esc(creator)}</div>` : ''}
            <div class="detail-chips">${(m.genres || []).map(g => `<span class="genre-tag">${g}</span>`).join('')}</div>
            ${nextHtml}
            ${watch}
            <div class="detail-section-label">あらすじ — Synopsis</div>
            <div class="detail-desc">${paras}</div>
            ${relatedHtml}
            ${chars ? `<div class="detail-section-label">キャラクター — Characters</div><div class="char-row">${chars}</div>` : ''}
            <div class="detail-section-label">予告編 — Trailer</div>${trailer}
          </div>
        </div>`;
      expandFranchise(m);
    })
    .catch(() => fail("Couldn't load this anime. The AniList API may be busy — try refreshing."));
  }

  // Walk the WHOLE franchise chain (all seasons), not just direct neighbours
  const FR_TYPES = ['PREQUEL', 'SEQUEL', 'PARENT', 'SIDE_STORY', 'SPIN_OFF', 'ALTERNATIVE'];
  const FR_Q = `query($ids:[Int]){Page(perPage:25){media(id_in:$ids,type:ANIME,isAdult:false){
    id format seasonYear status title{english romaji}coverImage{large}
    relations{edges{relationType node{id type}}}}}}`;
  async function expandFranchise(root) {
    try {
      const collected = new Map();
      let frontier = (root.relations.edges || [])
        .filter(e => e.node.type === 'ANIME' && FR_TYPES.includes(e.relationType))
        .map(e => e.node.id);
      let hops = 0;
      while (frontier.length && collected.size < 14 && hops < 5) {
        const res = await fetch('https://graphql.anilist.co', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ query: FR_Q, variables: { ids: frontier } })
        });
        if (!res.ok) return;
        const { data } = await res.json();
        const next = [];
        data.Page.media.forEach(md => {
          if (md.id === id || collected.has(md.id)) return;
          collected.set(md.id, md);
          (md.relations.edges || []).forEach(e => {
            if (e.node.type === 'ANIME' && (e.relationType === 'PREQUEL' || e.relationType === 'SEQUEL')
                && e.node.id !== id && !collected.has(e.node.id)) next.push(e.node.id);
          });
        });
        frontier = [...new Set(next)];
        hops++;
      }
      const row = document.getElementById('rel-row');
      if (!row || !collected.size) return;
      const list = [...collected.values()].sort((a, b) => (a.seasonYear || 9999) - (b.seasonYear || 9999));
      row.innerHTML = list.map(n => `
        <a class="rel-card" href="anime.html?id=${n.id}">
          <img src="${n.coverImage.large}" alt="" loading="lazy">
          <span class="rel-tag${n.status === 'NOT_YET_RELEASED' ? ' upcoming' : ''}">${n.status === 'NOT_YET_RELEASED' ? 'UPCOMING' : (n.format || '').replace(/_/g, ' ')}</span>
          <span class="rel-name">${n.title.english || n.title.romaji}</span>
          <span class="rel-meta">${n.status === 'NOT_YET_RELEASED' ? (n.seasonYear ? 'Coming ' + n.seasonYear : 'TBA') : (n.seasonYear || '')}</span>
        </a>`).join('');
    } catch (e) {}
  }

  // Click-to-play trailer facade (fast + avoids YouTube config errors)
  document.addEventListener('click', e => {
    const fac = e.target.closest('.trailer-embed[data-yt]');
    if (!fac) return;
    const vid = fac.dataset.yt;
    fac.removeAttribute('data-yt');
    fac.innerHTML = `<iframe src="https://www.youtube.com/embed/${vid}?autoplay=1&playsinline=1&rel=0&modestbranding=1"
      title="Trailer" frameborder="0" referrerpolicy="strict-origin-when-cross-origin"
      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
      allowfullscreen></iframe>`;
  });
</script>
