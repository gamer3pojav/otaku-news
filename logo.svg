    <path d="M180 200 L175 225 L185 228" fill="none" stroke="#b45309" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M150 250 Q180 265 210 248" fill="none" stroke="#78350f" stroke-width="4" stroke-linecap="round"/>
    <line x1="168" y1="254" x2="192" y2="254" stroke="#f43f5e" stroke-width="2" stroke-linecap="round"/>
